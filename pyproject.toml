[project]
name = "lanchain-project-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Safvan sidheeq", email = "mkdsafwan4@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159.1",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.2",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "loadenv>=0.1.1",
    "psycopg[binary]>=3.2.0",
    "psycopg2-binary>=2.9.9",
    "pydantic[email]>=2.0.0",
    "python-dotenv>=1.2.4",
    "python-jose[cryptography]>=3.4.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "sqlmodel>=0.0.22",
    "uvicorn>=0.54.0",
    "pwdlib[argon2]>=0.3.1",
    "faster-whisper>=1.2.1",
    "sounddevice>=0.5.6",
    "grok>=6.2",
    "groq>=0.37.1",
    "speechrecognition>=3.17.0",
    "pyaudio>=0.2.14",
    "pydub>=0.25.1",
    "pandas>=3.1.1",
    "numpy>=2.5.4",
    "matplotlib>=3.11.2",
    "scikit-learn>=1.9.1",
    "opencv-python>=5.0.0.93",
    "scikit-image>=0.26.0",
]

[project.scripts]
lanchain-project-1 = "lanchain_project_1:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
